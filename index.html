<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAH STORE | متجر الشحن الرقمي السريع</title>
  <!-- مكتبة Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- خط Cairo العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          },
          colors: {
            darkbg: '#070d0a',
            cardbg: '#0d1712',
            emeraldglow: '#10b981',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070d0a;
      color: #f3f4f6;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .ambient-bg {
      background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.16) 0%, rgba(7, 13, 10, 0) 62%);
    }

    .hero-banner {
      background: linear-gradient(155deg, #102418 0%, #0d1712 58%, #09100c 100%);
      border: 1px solid rgba(16, 185, 129, 0.32);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .btn-deposit {
      background: linear-gradient(90deg, #059669 0%, #10b981 50%, #059669 100%);
      border: 1px solid rgba(52, 211, 153, 0.45);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
    }
    .btn-deposit:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .btn-deposit:active {
      transform: scale(0.98);
    }

    .grid-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 1.05rem;
      overflow: hidden;
      border: 1px solid rgba(16, 185, 129, 0.22);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .grid-tile:hover, .grid-tile:active {
      border-color: rgba(16, 185, 129, 0.8);
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.25);
    }
    .grid-tile.disabled-tile {
      cursor: not-allowed;
      opacity: 0.72;
      border-color: rgba(239, 68, 68, 0.35);
    }
    .grid-tile.disabled-tile:hover {
      transform: none;
      border-color: rgba(239, 68, 68, 0.45);
      box-shadow: none;
    }
